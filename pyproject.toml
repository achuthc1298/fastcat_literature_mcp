[project]
name = "fastcat-literature"
version = "0.1.0"
description = "Literature search, publisher XML retrieval, and local LlamaIndex hybrid RAG over MCP"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp[cli]>=1.12,<2",
  "httpx>=0.28,<1",
  "python-dotenv>=1.1,<2",
  "defusedxml>=0.7.1,<1",
  "llama-index-core>=0.14,<0.15",
  "llama-index-embeddings-fastembed>=0.5,<0.6",
  "llama-index-vector-stores-qdrant>=0.9,<1",
  "fastembed>=0.7,<1",
  "filelock>=3.18",
  "mlx-lm>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.uv]
# NLTK rejects hardlinked corpus files on Linux; copy dependencies into the venv.
link-mode = "copy"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["main.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
